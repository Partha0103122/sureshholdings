name: Update portfolio data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-portfolio-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest market data
        run: node scripts/update-data.js

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/portfolio-data.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-data.json
          git commit -m "Update portfolio market data"
          git push
